name: Deploy dbt runner

# On a push to main that touches transform/: build and push the runner image,
# roll the dbt Cloud Run Jobs onto it and run a build, so a model change is
# exercised straight away. Scheduled runs are Cloud Scheduler's, not this
# workflow's (infra/runner.tf).
#
# First time: the Jobs do not exist until Terraform is applied with
# runner_image set, so the roll step skips them with a notice. Order is in
# docs/runbooks/bootstrap.md.
#
# Repo variables (not secrets, nothing here is confidential):
#   WIF_PROVIDER, DEPLOY_SA_EMAIL, GCP_PROJECT   -- from `terraform output`
on:
  push:
    branches: [main]
    paths:
      - 'transform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation to Google Cloud

# Two pushes in a row must not run two dbt builds at once (they write the same tables).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: europe-west1
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/lumio/dbt-runner

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push
        id: image
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" transform
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")" >> "$GITHUB_OUTPUT"

      # Pin the digest, not :latest, so a Job always runs exactly what was built here.
      - name: Roll the Jobs onto the new image
        id: roll
        run: |
          rolled=false
          for job in marts quality refresh; do
            if gcloud run jobs describe "dbt-$job" --region "$REGION" >/dev/null 2>&1; then
              gcloud run jobs update "dbt-$job" --region "$REGION" --image "${{ steps.image.outputs.ref }}"
              rolled=true
            else
              echo "::notice::dbt-$job does not exist yet, skipped"
            fi
          done
          echo "rolled=$rolled" >> "$GITHUB_OUTPUT"

      # A model change is built straight away: marts, then quality. Not the
      # refresh Job: that one is the periodic from-scratch rebuild.
      - name: Run the build
        if: steps.roll.outputs.rolled == 'true'
        run: |
          gcloud run jobs execute dbt-marts --region "$REGION" --wait
          gcloud run jobs execute dbt-quality --region "$REGION" --wait
